services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: teki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teki_secret}
      POSTGRES_DB: teki
    volumes:
      - teki-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teki -d teki"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://teki:${POSTGRES_PASSWORD:-teki_secret}@postgres:5432/teki
      DIRECT_URL: postgresql://teki:${POSTGRES_PASSWORD:-teki_secret}@postgres:5432/teki
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://whisper:8000}
    depends_on:
      postgres:
        condition: service_healthy

  # STT local para Voice Listening (origem 'local', custo zero por minuto).
  # Servidor OpenAI-compatible (POST /v1/audio/transcriptions) via faster-whisper.
  # Opcional: suba com `docker compose --profile voice up -d`.
  # Sem ele (e sem fallback cloud sob opt-in), utterances retornam STT_ERROR.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: [voice]
    restart: unless-stopped
    ports:
      - "9000:8000"
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
    volumes:
      - teki-whisper-cache:/home/ubuntu/.cache/huggingface

volumes:
  teki-pgdata:
  teki-whisper-cache:
